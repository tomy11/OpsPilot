x-core-env: &core-env
  APP_ENV: dev
  JWT_SECRET: ${JWT_SECRET:-change-me-dev-only}  # shared: every service verifies the same tokens
  DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@postgres:5432/opspilot
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}

x-agent-env: &agent-env
  <<: *core-env
  ERP_BASE_URL: http://erp-mock:8100
  KNOWLEDGE_BASE_URL: http://knowledge:8200
  APPROVAL_BACKEND: ${APPROVAL_BACKEND:-temporal}  # or cloudflare (workers/approvals)
  TEMPORAL_HOST: temporal:7233
  APPROVAL_TIMEOUT_HOURS: ${APPROVAL_TIMEOUT_HOURS:-24}
  APPROVALS_WORKER_URL: ${APPROVALS_WORKER_URL:-http://host.docker.internal:8787}
  APPROVALS_WORKER_SECRET: ${APPROVALS_WORKER_SECRET:-}
  APPROVALS_CALLBACK_SECRET: ${APPROVALS_CALLBACK_SECRET:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot"]
      interval: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: opspilot
      POSTGRES_PWD: opspilot
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on:
      postgres: { condition: service_healthy }

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]
    depends_on: [temporal]

  erp-mock:
    build: { context: ., args: { PACKAGE: opspilot-erp-mock } }
    command: ["uvicorn", "opspilot_erp_mock.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      CHAOS_ERROR_RATE: ${CHAOS_ERROR_RATE:-0.0}
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
    ports: ["8100:8100"]

  knowledge:
    build: { context: ., args: { PACKAGE: opspilot-knowledge } }
    command: ["uvicorn", "opspilot_knowledge.main:app", "--host", "0.0.0.0", "--port", "8200"]
    environment:
      <<: *core-env
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OLLAMA_EMBED_URL: ${OLLAMA_EMBED_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      KNOWLEDGE_MIN_VECTOR: ${KNOWLEDGE_MIN_VECTOR:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8200:8200"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: on-failure

  docflow:
    build: { context: ., args: { PACKAGE: opspilot-docflow } }
    command: ["uvicorn", "opspilot_docflow.main:app", "--host", "0.0.0.0", "--port", "8300"]
    environment:
      <<: *core-env
      ERP_BASE_URL: http://erp-mock:8100
      AUTO_POST_LIMIT: ${AUTO_POST_LIMIT:-5000}
    ports: ["8300:8300"]
    depends_on:
      postgres: { condition: service_healthy }
      erp-mock: { condition: service_started }
    restart: on-failure

  agent:
    build: { context: ., args: { PACKAGE: opspilot-agent } }
    command: ["uvicorn", "opspilot_agent.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *agent-env
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-glm-5.3-flash:cloud}
      OLLAMA_EFFORT: ${OLLAMA_EFFORT:-high}
      CREDITS_ENABLED: ${CREDITS_ENABLED:-false}
      CREDIT_MONTHLY_BUDGET_USD: ${CREDIT_MONTHLY_BUDGET_USD:-20}
      # Empty = the default in opspilot_agent/config.py
      CREDIT_MAX_PER_RUN: ${CREDIT_MAX_PER_RUN:-}
      CREDIT_DAILY_RUNS: ${CREDIT_DAILY_RUNS:-}
      CREDIT_PRICE_INPUT_USD: ${CREDIT_PRICE_INPUT_USD:-}
      CREDIT_PRICE_OUTPUT_USD: ${CREDIT_PRICE_OUTPUT_USD:-}
      CREDIT_PRICE_CACHED_USD: ${CREDIT_PRICE_CACHED_USD:-}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-}
      CHAT_HISTORY_TURNS: ${CHAT_HISTORY_TURNS:-}
      CHAT_HISTORY_BYTES: ${CHAT_HISTORY_BYTES:-}
      LOGIN_MAX_FAILURES_PER_IP: ${LOGIN_MAX_FAILURES_PER_IP:-}
      LOGIN_MAX_FAILURES_PER_USER: ${LOGIN_MAX_FAILURES_PER_USER:-}
      LOGIN_WINDOW_S: ${LOGIN_WINDOW_S:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      erp-mock: { condition: service_started }
      knowledge: { condition: service_started }
    restart: on-failure

  worker:
    build: { context: ., args: { PACKAGE: opspilot-agent } }
    command: ["python", "-m", "opspilot_agent.worker.main"]
    environment: *agent-env
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }
      erp-mock: { condition: service_started }
    restart: on-failure

volumes:
  pgdata:
