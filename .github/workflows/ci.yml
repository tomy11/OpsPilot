name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/agent/src/opspilot_agent/web/package-lock.json
      - name: Build workspace UI
        working-directory: apps/agent/src/opspilot_agent/web
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python apps/knowledge/evals/knowledge_eval.py
      - run: uv run python apps/docflow/evals/docflow_eval.py
