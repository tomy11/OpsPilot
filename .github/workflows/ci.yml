name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/agent/src/opspilot_agent/web/package-lock.json
      - name: Build workspace UI
        working-directory: apps/agent/src/opspilot_agent/web
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python apps/knowledge/evals/knowledge_eval.py
      - run: uv run python apps/knowledge/evals/knowledge_eval.py --cases semantic
      - run: uv run python apps/docflow/evals/docflow_eval.py

  approvals-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/approvals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/approvals/package-lock.json
      - run: npm ci
      - run: npm run typecheck
