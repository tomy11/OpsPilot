# uv workspace root (virtual: not a package itself). `uv sync` installs every member + dev tools.
[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
opspilot-core = { workspace = true }
opspilot-erp-mock = { workspace = true }
opspilot-agent = { workspace = true }
opspilot-knowledge = { workspace = true }
opspilot-docflow = { workspace = true }

[dependency-groups]
dev = [
    "opspilot-core",
    "opspilot-erp-mock",
    "opspilot-agent",
    "opspilot-knowledge",
    "opspilot-docflow",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "apps"]
# Each package has its own tests/conftest.py; importlib mode keeps same-named modules apart.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "TID251"]
ignore = ["E501"]  # formatter owns line length; long Thai strings stay unbroken

[tool.ruff.lint.isort]
known-first-party = [
    "opspilot_core", "opspilot_erp_mock", "opspilot_agent", "opspilot_knowledge", "opspilot_docflow",
]
