[project]
name = "opspilot-erp-mock"
version = "0.1.0"
description = "Mock ERP/POS API with idempotency and chaos knobs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot_erp_mock"]
