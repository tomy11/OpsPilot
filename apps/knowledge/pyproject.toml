[project]
name = "opspilot-knowledge"
version = "0.1.0"
description = "OpsPilot Knowledge: permission-aware hybrid RAG with verified citations"
requires-python = ">=3.12"
dependencies = [
    "opspilot-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot_knowledge"]

[tool.uv.sources]
opspilot-core = { workspace = true }
