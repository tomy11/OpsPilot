[project]
name = "opspilot-docflow"
version = "0.1.0"
description = "OpsPilot DocFlow: invoice/receipt extraction, validation, review queue and ERP posting"
requires-python = ">=3.12"
dependencies = [
    "opspilot-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "tenacity>=8.5",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot_docflow"]

[tool.uv.sources]
opspilot-core = { workspace = true }
